<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grocery Price Compare</title>
  <meta name="description" content="Compare grocery prices across Australian supermarkets, build shared shopping lists and see where to buy each item cheapest.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%232a78d6'/%3E%3Ctext x='16' y='22' font-size='17' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E$%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
  <script src="/vendor/chart.js/chart.umd.js" defer></script>
  <script src="/app.js" type="module"></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>Grocery Price Compare</h1>
      <span class="sub" id="store-names"></span>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="compare" aria-selected="true">Compare</button>
      <button role="tab" data-tab="list">Lists <span id="list-count" class="pill" hidden>0</span></button>
      <button role="tab" data-tab="changes">Price changes</button>
      <button role="tab" data-tab="admin" id="admin-tab" hidden>Admin</button>
    </nav>
    <div class="account" id="account"></div>
  </header>

  <div id="demo-banner" class="banner" hidden>
    Showing <strong>demo data</strong> with made-up prices.
  </div>

  <main>
    <!-- Compare -->
    <section id="tab-compare" class="tab">
      <form id="search-form" class="search">
        <input id="q" type="search" placeholder="Search products, e.g. full cream milk 2L" autocomplete="off" autofocus>
        <select id="store-filter" aria-label="Store"><option value="">All stores</option></select>
        <select id="mode-filter" aria-label="Matching">
          <option value="similar">Match any brand, same size</option>
          <option value="exact">Match same brand only</option>
        </select>
        <label class="check"><input id="specials" type="checkbox"> Specials only</label>
      </form>
      <p class="hint">Products count as the same item when the pack size matches exactly and the name is similar, ignoring brand. Click a product to see its price history.</p>
      <div id="results" class="results"></div>
      <p class="hint" id="updated-hint"></p>
    </section>

    <!-- Lists -->
    <section id="tab-list" class="tab" hidden>
      <div id="list-root"></div>
    </section>

    <!-- Price changes -->
    <section id="tab-changes" class="tab" hidden>
      <div class="list-head">
        <h2>Biggest price moves</h2>
        <div class="actions">
          <select id="changes-dir" aria-label="Direction">
            <option value="">Rises and drops</option>
            <option value="down">Price drops</option>
            <option value="up">Price rises</option>
          </select>
          <select id="changes-days" aria-label="Period">
            <option value="1">Last 24 hours</option>
            <option value="7" selected>Last 7 days</option>
            <option value="30">Last 30 days</option>
          </select>
        </div>
      </div>
      <div id="changes"></div>
    </section>

    <!-- Admin -->
    <section id="tab-admin" class="tab" hidden>
      <div id="admin-root"></div>
    </section>
  </main>

  <dialog id="product-dialog">
    <form method="dialog"><button class="close" aria-label="Close">×</button></form>
    <div id="product-detail"></div>
  </dialog>

  <dialog id="order-dialog">
    <form method="dialog"><button class="close" aria-label="Close">×</button></form>
    <div id="order-detail"></div>
  </dialog>

  <dialog id="share-dialog">
    <form method="dialog"><button class="close" aria-label="Close">×</button></form>
    <div id="share-detail"></div>
  </dialog>

  <dialog id="auth-dialog" class="narrow">
    <form method="dialog"><button class="close" aria-label="Close">×</button></form>
    <div class="auth-switch" role="tablist">
      <button type="button" data-auth="login" aria-selected="true">Log in</button>
      <button type="button" data-auth="signup" aria-selected="false">Sign up</button>
    </div>
    <p id="auth-reason" class="hint"></p>
    <form id="auth-form" class="stack">
      <label data-signup-only hidden>Name<input name="name" autocomplete="name" maxlength="80"></label>
      <label>Email<input name="email" type="email" autocomplete="email" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" minlength="8" required></label>
      <p id="auth-error" class="warn" hidden></p>
      <button class="primary" type="submit" id="auth-submit">Log in</button>
    </form>
  </dialog>
</body>
</html>
