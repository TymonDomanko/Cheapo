# Render Blueprint — see DEPLOY.md. In Render: New → Blueprint → pick this repo.
# A persistent disk needs a paid instance type (Starter or above).
services:
  - type: web
    name: grocery-compare
    runtime: docker
    plan: starter
    region: singapore
    healthCheckPath: /healthz
    numInstances: 1
    disk:
      name: grocery-data
      mountPath: /data
      sizeGB: 3
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: TRUST_PROXY
        value: "1"
      - key: TZ
        value: Australia/Sydney
      - key: SCRAPE_CRON
        value: "15 4 * * *"
      - key: ADMIN_EMAILS
        sync: false # Render asks for this when you create the Blueprint
