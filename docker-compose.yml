# Run on your own machine or a home server: http://localhost:3000 (or HOST_PORT in .env)
#   cp .env.example .env   (set ADMIN_EMAILS; for plain http on a LAN set SECURE_COOKIES=false)
#   docker compose up -d
# Update: docker compose pull && docker compose up -d
# Uses the published image. To build from this checkout instead, uncomment `build: .` and run
# `docker compose up -d --build` (then pulling no longer updates it: it runs what's checked out here).
services:
  app:
    image: ghcr.io/tymondomanko/cheapo:latest
    # build: .
    restart: unless-stopped
    ports:
      # HOST_PORT: the port on this machine (default 3000). PORT: the app's port inside the
      # container. HOST_BIND=127.0.0.1 keeps it off the network (e.g. behind your own nginx).
      - "${HOST_BIND:-0.0.0.0}:${HOST_PORT:-3000}:${PORT:-3000}"
    env_file: .env
    volumes:
      - grocery-data:/data

volumes:
  grocery-data:
