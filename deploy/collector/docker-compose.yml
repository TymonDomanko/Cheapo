# A helper's collector in Docker. (No Docker? Each helper on the Admin page has a
# "Download it" section with a ready-to-run version that updates itself.)
# Run this on any always-on machine (PC, NAS, Raspberry Pi). It checks in with your site and fetches
# what it's asked for, from this connection.
#   cp .env.example .env    # set COLLECTOR_SERVER and COLLECTOR_TOKEN (the helper's token)
#   docker compose up -d
services:
  collector:
    image: ghcr.io/tymondomanko/cheapo:latest
    restart: unless-stopped
    env_file: .env
    command: ["node", "src/cli/collect.js"]
  # Keeps the collector image up to date (checks nightly).
  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --schedule "0 30 3 * * *" --cleanup
