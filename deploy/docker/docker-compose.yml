# Public server with automatic HTTPS (Caddy + Let's Encrypt).
# Needs: a Linux server with Docker, a domain whose DNS points at it, ports 80 and 443 open
# (or HTTP_PORT / HTTPS_PORT in .env, if your router forwards 80 and 443 to other ports).
#   cp .env.example .env    # set DOMAIN and ADMIN_EMAILS
#   docker compose up -d
services:
  app:
    image: ghcr.io/tymondomanko/cheapo:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      TRUST_PROXY: "1"
    volumes:
      - grocery-data:/data
    expose:
      - "${PORT:-3000}"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      APP_PORT: ${PORT:-3000}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # Optional: pull new images every night so updates roll out automatically.
  # Remove this service if you'd rather update by hand (docker compose pull && docker compose up -d).
  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --schedule "0 0 3 * * *" --cleanup

volumes:
  grocery-data:
  caddy-data:
  caddy-config:
